name: Android-app (APK)

on:
  push:
    branches: [claude/funny-brown-oc8cne, main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor installeren
        run: npm install --no-audit --no-fund

      - name: Webmap maken
        run: node scripts/build-www.js

      - name: Android-project aanmaken
        run: |
          sudo apt-get install -y imagemagick > /dev/null
          npx cap add android
          npx cap sync android
          bash scripts/android-tweaks.sh

      - name: APK bouwen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK klaarzetten
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Vrienden-Run.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vrienden-Run-apk
          path: Vrienden-Run.apk

      - name: Release met download maken
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vrienden Run (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **Vrienden-Run.apk** hieronder en open het bestand op je Android-telefoon.
            Android vraagt om "installeren van onbekende apps" toe te staan voor je browser of bestanden-app.
          files: Vrienden-Run.apk
